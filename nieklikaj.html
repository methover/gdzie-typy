<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nie klikaj</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: fill;
            animation: violent-shake 0.08s infinite;
        }

        @keyframes violent-shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-18px, 12px) rotate(-3deg); }
            40% { transform: translate(16px, -14px) rotate(3deg); }
            60% { transform: translate(-14px, -18px) rotate(-2deg); }
            80% { transform: translate(20px, 16px) rotate(2deg); }
        }
    </style>
</head>
<body>
    <img src="GDZIETYPY2.jpg" alt="GDZIE TYPY">
    <audio id="typy-audio" src="typy.mp3" autoplay loop></audio>
    <script>
        const audio = document.getElementById('typy-audio');
        audio.play().catch(() => {
            document.addEventListener('click', () => audio.play(), { once: true });
        });
    </script>
</body>
</html>
